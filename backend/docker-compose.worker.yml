# Worker de render en el servidor dedicado (ver WORKER_DEPLOY.md).
#
#   docker compose -f docker-compose.worker.yml up -d --build
#
# Para sumar capacidad NO se agregan copias de este servicio en el mismo
# servidor (compartirian los mismos nucleos): se levanta este mismo archivo
# en OTRO servidor con otro WORKER_ID en su .env.worker.
services:
  worker:
    build: .
    image: skaler-render-worker
    env_file: .env.worker
    environment:
      # Temporales del render en el volumen de abajo (disco NVMe del
      # servidor), no en el /tmp del contenedor.
      WORK_DIR: /data/work
    volumes:
      - render-work:/data/work
    # Si el proceso muere o el servidor se reinicia, vuelve a levantar solo
    # y retoma la cola (ver recoverOwnJobs en src/worker.ts).
    restart: unless-stopped
    # tini como PID 1: reenvia SIGTERM a Node y limpia procesos ffmpeg
    # huerfanos.
    init: true
    # Al actualizar (`up -d --build`) o bajar el contenedor, el worker deja
    # de tomar trabajos y espera los que estan corriendo antes de salir
    # (WORKER_SHUTDOWN_GRACE_MS, 14 min por default) -- esto tiene que ser
    # mayor, si no Docker lo mata antes.
    stop_grace_period: 15m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  render-work:
